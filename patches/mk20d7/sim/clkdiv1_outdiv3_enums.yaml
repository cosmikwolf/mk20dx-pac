# SIM CLKDIV1 OUTDIV3 (FlexBus clock divider) enumerated values
# MK20D7 only — MK20D5 does not have OUTDIV3 in CLKDIV1
# Source: K20P64M72SF1 Reference Manual, SIM chapter
SIM:
  CLKDIV1:
    OUTDIV3:
      _replace_enum:
        Div1: [0, "Divide-by-1"]
        Div2: [1, "Divide-by-2"]
        Div3: [2, "Divide-by-3"]
        Div4: [3, "Divide-by-4"]
        Div5: [4, "Divide-by-5"]
        Div6: [5, "Divide-by-6"]
        Div7: [6, "Divide-by-7"]
        Div8: [7, "Divide-by-8"]
        Div9: [8, "Divide-by-9"]
        Div10: [9, "Divide-by-10"]
        Div11: [10, "Divide-by-11"]
        Div12: [11, "Divide-by-12"]
        Div13: [12, "Divide-by-13"]
        Div14: [13, "Divide-by-14"]
        Div15: [14, "Divide-by-15"]
        Div16: [15, "Divide-by-16"]
